name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: jacigreen
  POSTGRES_PASSWORD: ci-only-password
  POSTGRES_DB: jacigreen

jobs:
  backend:
    name: Backend (Ruff, migrations, OpenAPI, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jacigreen" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://jacigreen:ci-only-password@localhost:5432/jacigreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - run: coverage run manage.py test
      - run: coverage report

  frontend:
    name: Frontend (ESLint, Prettier, TypeScript, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8000
      VITE_SITE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage

  prerender:
    name: Pré-rendu SEO (build contre l'API réelle)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jacigreen" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://jacigreen:ci-only-password@localhost:5432/jacigreen
      API_INTERNAL_URL: http://localhost:8000
      VITE_API_URL: http://localhost:8000
      VITE_SITE_URL: https://ci.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Démarrer l'API avec des données de démonstration
        working-directory: backend
        run: |
          pip install -r requirements/dev.txt
          python manage.py migrate --noinput
          python manage.py seed_demo
          nohup python manage.py runserver 0.0.0.0:8000 --noreload > /tmp/django.log 2>&1 &
          for i in $(seq 1 20); do curl -sf localhost:8000/api/v1/health/ && break || sleep 1; done
      - name: Construire le site (pré-rendu) et contrôler le HTML généré
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run check:prerender

  docker:
    name: Docker (configuration Compose et images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker build --target production backend
